<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16315c">
<title>Danh sách điểm danh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#16315c; --navy-2:#1f457f;
    --bg:#eef1f6; --surface:#ffffff; --ink:#18212f; --muted:#5d6b7e;
    --line:#d9dfe8; --field:#f8fafc;
    --accent:#0d7a6f; --accent-soft:#e2f3f0;
    --warn:#a35a00; --warn-soft:#fdf0dc;
    --err:#b3261e; --err-soft:#fbe8e6;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0e1522; --surface:#172131; --ink:#eef2f8; --muted:#9aa9bd;
      --line:#2a3850; --field:#101a29;
      --navy:#0f2447; --navy-2:#2b5aa6;
      --accent:#3cc2b2; --accent-soft:#12332f;
      --warn:#f0b35a; --warn-soft:#3a2b12;
      --err:#ff8a80; --err-soft:#3a1816;
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size:16px; line-height:1.5;
  }

  /* ---------- Header ---------- */
  .top { background:var(--navy); color:#fff; padding:22px 20px 56px; }
  .top-inner { max-width:640px; margin:0 auto; }
  .top-row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .top h1 { margin:0; font-size:1.5rem; font-weight:700; letter-spacing:-.01em; }
  .top .sub { margin:2px 0 0; color:rgba(255,255,255,.72); font-size:.9rem; }
  .nav { margin-top:10px; display:flex; flex-wrap:wrap; gap:4px 16px; }
  .nav a { color:rgba(255,255,255,.88); font-size:.88rem; text-decoration:underline; text-underline-offset:3px; }
  .nav a:hover { color:#fff; }
  .picker h2 { margin:0 0 4px; font-size:1.05rem; font-weight:600; }
  .picker p { margin:0 0 12px; color:var(--muted); font-size:.9rem; }
  .picker ul { list-style:none; margin:0 0 12px; padding:0; display:grid; gap:8px; }
  .picker a.pick {
    display:block; padding:12px 14px; border:1px solid var(--line); border-radius:12px;
    background:var(--field); color:var(--ink); text-decoration:none;
  }
  .picker a.pick:hover { border-color:var(--navy-2); }
  .picker a.pick b { display:block; font-weight:600; overflow-wrap:anywhere; }
  .picker a.pick small { color:var(--muted); font-size:.82rem; }
  .session {
    flex-shrink:0; max-width:48%; text-align:right;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22);
    border-radius:10px; padding:6px 12px;
  }
  .session small { display:block; color:rgba(255,255,255,.7); font-size:.72rem; }
  .session b { display:block; font-size:.95rem; font-weight:600; overflow-wrap:anywhere; }

  .stats { margin-top:18px; display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .stat { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); border-radius:10px; padding:8px 6px; text-align:center; }
  .stat b { display:block; font-size:1.35rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.2; }
  .stat small { display:block; font-size:.72rem; color:rgba(255,255,255,.75); }

  /* ---------- Layout ---------- */
  main { max-width:640px; margin:-34px auto 0; padding:0 16px 40px; }
  .panel {
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; box-shadow:0 8px 24px rgba(22,49,92,.10);
  }
  .banner { border-radius:10px; padding:12px 14px; font-size:.92rem; margin-bottom:12px; }
  .banner.warn { background:var(--warn-soft); color:var(--warn); }
  .banner.err { background:var(--err-soft); color:var(--err); }

  /* ---------- Toolbar ---------- */
  .toolbar { display:flex; gap:8px; }
  .search {
    flex:1; min-width:0; padding:11px 14px; font:inherit; color:var(--ink);
    background:var(--field); border:1px solid var(--line); border-radius:10px;
  }
  .search::placeholder { color:var(--muted); opacity:.7; }
  :focus-visible { outline:3px solid var(--navy-2); outline-offset:2px; }
  .search:focus-visible { outline-offset:0; border-color:var(--navy-2); }
  .icon-btn {
    flex-shrink:0; width:46px; border-radius:10px; border:1px solid var(--line);
    background:transparent; color:var(--ink); cursor:pointer; display:grid; place-items:center;
  }
  .icon-btn svg { width:20px; height:20px; }
  .icon-btn.spin svg { animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .tabs { display:flex; gap:6px; margin-top:12px; overflow-x:auto; padding-bottom:2px; }
  .tab {
    flex-shrink:0; font:inherit; font-size:.88rem; font-weight:500; cursor:pointer;
    padding:7px 14px; border-radius:99px; border:1px solid var(--line);
    background:transparent; color:var(--ink); display:flex; align-items:center; gap:6px;
  }
  .tab .n { font-variant-numeric:tabular-nums; color:var(--muted); font-weight:600; }
  .tab[aria-selected="true"] { background:var(--navy); border-color:var(--navy); color:#fff; }
  .tab[aria-selected="true"] .n { color:rgba(255,255,255,.8); }
  @media (prefers-color-scheme: dark) { .tab[aria-selected="true"] { background:var(--navy-2); border-color:var(--navy-2); } }

  /* ---------- Groups & items ---------- */
  .group { margin-top:20px; }
  .group-head { display:flex; align-items:center; gap:8px; margin:0 0 8px; font-size:.95rem; font-weight:600; }
  .group-head .count { color:var(--muted); font-weight:500; }
  .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .dot.present { background:var(--accent); }
  .dot.late { background:var(--warn); }
  .dot.absent { background:var(--err); }

  .list { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  .item {
    display:flex; align-items:center; gap:12px; padding:10px 12px;
    border:1px solid var(--line); border-radius:12px; background:var(--field);
  }
  .avatar {
    width:48px; height:62px; flex-shrink:0; border-radius:8px; object-fit:cover;
    background:#0b1220; border:0; padding:0; cursor:pointer; transform:scaleX(-1);
  }
  .avatar.none {
    cursor:default; transform:none; display:grid; place-items:center; color:#9fb0c8;
  }
  .avatar.none svg { width:22px; height:22px; }
  .info { min-width:0; flex:1; }
  .info .nm { font-weight:600; overflow-wrap:anywhere; }
  .info .meta { color:var(--muted); font-size:.84rem; overflow-wrap:anywhere; }
  .badge {
    flex-shrink:0; font-size:.76rem; font-weight:600; padding:3px 10px; border-radius:99px; white-space:nowrap;
  }
  .badge.present { background:var(--accent-soft); color:var(--accent); }
  .badge.late { background:var(--warn-soft); color:var(--warn); }
  .badge.absent { background:var(--err-soft); color:var(--err); }

  .empty, .loading { text-align:center; color:var(--muted); padding:28px 12px; font-size:.92rem; }
  .updated { margin:14px 0 0; color:var(--muted); font-size:.8rem; text-align:center; }

  /* ---------- Xem ảnh lớn ---------- */
  dialog { border:0; padding:0; background:transparent; max-width:92vw; }
  dialog::backdrop { background:rgba(0,0,0,.7); }
  dialog .box { background:var(--surface); border-radius:14px; padding:14px; max-width:360px; text-align:center; }
  dialog img { width:100%; max-height:70vh; object-fit:cover; border-radius:10px; transform:scaleX(-1); background:#0b1220; }
  dialog .cap { margin:10px 0 0; font-weight:600; }
  dialog .cap small { display:block; color:var(--muted); font-weight:400; }
  dialog button {
    margin-top:12px; width:100%; min-height:44px; font:inherit; font-weight:600; cursor:pointer;
    border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--ink);
  }

  .login h2 { margin:0 0 4px; font-size:1.05rem; font-weight:600; }
  .login p { margin:0 0 14px; color:var(--muted); font-size:.9rem; }
  .login input {
    width:100%; padding:12px 14px; font:inherit; color:var(--ink); margin-bottom:12px;
    background:var(--field); border:1px solid var(--line); border-radius:10px;
  }
  .login input:focus-visible { outline-offset:0; border-color:var(--navy-2); }
  .login .go {
    width:100%; min-height:46px; font:inherit; font-weight:600; border-radius:10px; cursor:pointer;
    border:1px solid var(--navy); background:var(--navy); color:#fff;
  }
  .login .go:disabled { opacity:.6; cursor:wait; }
  @media (prefers-color-scheme: dark) { .login .go { background:var(--navy-2); border-color:var(--navy-2); } }
  .logout { background:none; border:0; padding:0; font:inherit; font-size:.88rem; color:rgba(255,255,255,.88); text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
  .logout:hover { color:#fff; }

  [hidden] { display:none !important; }
  @media (max-width:380px) { .badge { display:none; } }
  @media (prefers-reduced-motion: reduce) { .icon-btn.spin svg { animation:none; } }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="top-row">
      <div>
        <h1>Danh sách điểm danh</h1>
        <p class="sub">Phân loại theo kết quả điểm danh</p>
        <div class="nav"><a href="admin.html">← Quản trị / tạo mã QR</a><a href="danh-sach.html">Chọn buổi khác</a><button type="button" class="logout" id="btnLogout" hidden>Đăng xuất</button></div>
      </div>
      <div class="session"><small>Buổi học</small><b id="sessionLabel">—</b></div>
    </div>
    <div class="stats" aria-label="Thống kê">
      <div class="stat"><b id="s-all">0</b><small>Tổng</small></div>
      <div class="stat"><b id="s-present">0</b><small>Có mặt</small></div>
      <div class="stat"><b id="s-late">0</b><small>Trễ</small></div>
      <div class="stat"><b id="s-absent">0</b><small>Vắng</small></div>
    </div>
  </div>
</header>

<main>
  <section class="panel login" id="loginPanel" hidden>
    <h2>Đăng nhập để xem danh sách</h2>
    <p id="loginHint"></p>
    <div class="banner err" id="loginErr" hidden></div>
    <input type="password" id="pw" placeholder="Mật khẩu" autocomplete="current-password" aria-label="Mật khẩu">
    <button type="button" class="go" id="btnLogin">Đăng nhập</button>
  </section>

  <section class="panel" id="mainPanel" hidden>
    <div class="picker" id="picker" hidden></div>
    <div class="banner err" id="errBox" hidden></div>

    <div class="toolbar">
      <input type="search" class="search" id="q" placeholder="Tìm theo tên, MSSV hoặc lớp" autocomplete="off" aria-label="Tìm sinh viên">
      <button type="button" class="icon-btn" id="btnReload" aria-label="Tải lại danh sách">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>

    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-f="all" aria-selected="true">Tất cả <span class="n" id="t-all">0</span></button>
      <button class="tab" role="tab" data-f="present" aria-selected="false">Có mặt <span class="n" id="t-present">0</span></button>
      <button class="tab" role="tab" data-f="late" aria-selected="false">Trễ <span class="n" id="t-late">0</span></button>
      <button class="tab" role="tab" data-f="absent" aria-selected="false">Vắng <span class="n" id="t-absent">0</span></button>
    </div>

    <div id="content"><div class="loading">Đang tải danh sách…</div></div>
    <p class="updated" id="updated"></p>
  </section>
</main>

<dialog id="viewer">
  <div class="box">
    <img id="viewImg" alt="Ảnh xác nhận">
    <p class="cap" id="viewCap"></p>
    <button type="button" id="viewClose">Đóng</button>
  </div>
</dialog>

<script>
/* ========= CẤU HÌNH ========= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxBpVZDj6cU2oJsCAi51Qz2mj8fbLdLA9XYN1avZdmwqejsQnMeaj3iHdlUrmkRAIM/exec";
const DEADLINE = new Date("2026-10-08T20:00:00+07:00"); // phải trùng với index.html
const REFRESH_MS = 30000;                               // tự tải lại mỗi 30 giây
const STORE_KEY = "checkin_codes_v1";
const PW_KEY = "checkin_admin_pw";                       // lưu tạm trong tab, tự mất khi đóng tab                   // danh sách mã do trang admin.html lưu
/* ============================ */

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const session = params.get("s") || "";
const demo = params.has("demo"); // ?demo=1 để xem thử giao diện với dữ liệu mẫu

$("sessionLabel").textContent = session || (demo ? "Dữ liệu mẫu" : "Chưa xác định");

/* ---------- Đăng nhập ---------- */
let pw = "";
try { pw = sessionStorage.getItem(PW_KEY) || ""; } catch (e) {}

function showLogin(msg) {
  pw = ""; try { sessionStorage.removeItem(PW_KEY); } catch (e) {}
  $("mainPanel").hidden = true; $("loginPanel").hidden = false; $("btnLogout").hidden = true;
  $("loginHint").textContent = session
    ? "Nhập mật khẩu của buổi học " + session + " (hoặc mật khẩu quản trị) để xem danh sách."
    : "Nhập mật khẩu quản trị để chọn buổi học.";
  $("loginErr").textContent = msg || ""; $("loginErr").hidden = !msg;
  $("pw").value = ""; $("btnLogin").disabled = false; $("btnLogin").textContent = "Đăng nhập";
  $("pw").focus();
}
function enter() {
  $("loginPanel").hidden = true; $("mainPanel").hidden = false; $("btnLogout").hidden = demo;
  if (!session && !demo) renderPicker(); else load();
}
async function doLogin() {
  const v = $("pw").value;
  if (!v) { $("loginErr").textContent = "Vui lòng nhập mật khẩu."; $("loginErr").hidden = false; return; }
  $("btnLogin").disabled = true; $("btnLogin").textContent = "Đang kiểm tra…"; $("loginErr").hidden = true;
  try {
    const res = await fetch(SCRIPT_URL + "?action=auth&s=" + encodeURIComponent(session) + "&pw=" + encodeURIComponent(v));
    const data = JSON.parse(await res.text());
    if (data && data.ok) {
      pw = v; try { sessionStorage.setItem(PW_KEY, v); } catch (e) {}
      enter();
    } else showLogin((data && data.message) || "Mật khẩu không đúng.");
  } catch (e) {
    showLogin("Không kết nối được máy chủ. Backend cần có hàm kiểm tra mật khẩu (action=auth) và đã được triển khai phiên bản mới.");
  }
}
$("btnLogin").onclick = doLogin;
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("btnLogout").onclick = () => { records = []; showLogin(""); };

/* Chưa có ?s=: liệt kê các mã đã tạo ở trang quản trị để chọn */
function renderPicker() {
  let list = [];
  try { list = JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch (e) {}
  document.querySelector(".toolbar").hidden = true;
  $("tabs").hidden = true;
  const box = $("picker"); box.hidden = false; box.textContent = "";
  const h = document.createElement("h2"); h.textContent = "Chọn buổi học";
  const p = document.createElement("p");
  box.append(h, p);
  if (!list.length) {
    p.textContent = "Chưa có mã nào được tạo trên trình duyệt này. Hãy tạo mã ở trang quản trị, hoặc mở trang với đường dẫn dạng danh-sach.html?s=MÃ_BUỔI.";
    const a = document.createElement("a"); a.href = "admin.html"; a.textContent = "Đến trang quản trị →";
    box.appendChild(a); return;
  }
  p.textContent = "Các mã bạn đã tạo ở trang quản trị:";
  const ul = document.createElement("ul");
  list.forEach(r => {
    const li = document.createElement("li");
    const a = document.createElement("a"); a.className = "pick"; a.href = "danh-sach.html?s=" + encodeURIComponent(r.code);
    const b = document.createElement("b"); b.textContent = r.code;
    const sm = document.createElement("small");
    const d = String(r.date || "").split("-");
    sm.textContent = [r.title, d.length === 3 ? d[2] + "/" + d[1] + "/" + d[0] : ""].filter(Boolean).join(" · ");
    a.append(b, sm); li.appendChild(a); ul.appendChild(li);
  });
  box.appendChild(ul);
}

const GROUPS = [
  { key:"present", label:"Có mặt" },
  { key:"late",    label:"Trễ" },
  { key:"absent",  label:"Vắng" }
];
const LABEL = { present:"Có mặt", late:"Trễ", absent:"Vắng" };

let records = [];   // đã chuẩn hóa: {mssv,name,cls,time,photo,result}
let filter = "all";

/* ---------- Chuẩn hóa dữ liệu ---------- */
const plain = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");

function resultOf(r, absent) {
  if (absent) return "absent";
  const v = plain(r.result || r.status || r.ketqua);
  if (/vang|absent/.test(v)) return "absent";
  if (/tre|muon|late/.test(v)) return "late";
  if (/co mat|dung|present|ok/.test(v)) return "present";
  const t = new Date(r.time || r.timestamp);
  if (!isNaN(t) && t > DEADLINE) return "late";   // chưa có cột kết quả: so với hạn điểm danh
  return "present";
}

function normalize(data) {
  const arr = Array.isArray(data) ? data : (data.records || data.list || []);
  const abs = Array.isArray(data) ? [] : (data.absent || []);
  const out = arr.map(r => ({
    mssv: String(r.mssv || "").trim(), name: String(r.name || "").trim(), cls: String(r.cls || "").trim(),
    time: r.time || r.timestamp || "", photo: r.photo || r.photoUrl || "",
    result: resultOf(r, false)
  }));
  abs.forEach(r => out.push({
    mssv: String(r.mssv || "").trim(), name: String(r.name || "").trim(), cls: String(r.cls || "").trim(),
    time: "", photo: "", result: "absent"
  }));
  return out;
}

/* ---------- Hiển thị ---------- */
function fmtTime(t) {
  const d = new Date(t);
  return isNaN(d) ? "" : d.toLocaleString("vi-VN", { hour12:false, hour:"2-digit", minute:"2-digit", day:"2-digit", month:"2-digit" });
}

/* Ảnh Drive: thử lần lượt nhiều dạng link, hết cách thì chạy onFail */
function driveId(u) {
  const s = String(u || "");
  const m = s.match(/[?&]id=([-\w]{20,})/) || s.match(/\/d\/([-\w]{20,})/) || s.match(/^([-\w]{25,})$/);
  return m ? m[1] : "";
}
function setPhoto(img, url, size, onFail) {
  const id = String(url || "").startsWith("data:") ? "" : driveId(url);
  const list = id ? [
    "https://lh3.googleusercontent.com/d/" + id + "=w" + size,
    "https://drive.google.com/thumbnail?id=" + id + "&sz=w" + size,
    "https://drive.google.com/uc?export=view&id=" + id
  ] : [url];
  let i = 0;
  img.referrerPolicy = "no-referrer";
  img.onerror = () => { if (++i < list.length) img.src = list[i]; else { img.onerror = null; if (onFail) onFail(); } };
  img.src = list[0];
}

function makeItem(r) {
  const li = document.createElement("li"); li.className = "item";

  let av;
  if (r.photo) {
    av = document.createElement("button"); av.type = "button"; av.className = "avatar";
    av.style.padding = "0"; av.setAttribute("aria-label", "Xem ảnh của " + r.name);
    const img = document.createElement("img");
    img.alt = ""; img.loading = "lazy";
    img.style.cssText = "width:100%;height:100%;object-fit:cover;border-radius:8px;display:block";
    av.appendChild(img);
    av.style.transform = "none"; img.style.transform = "scaleX(-1)";
    setPhoto(img, r.photo, 200, () => {
      av.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>';
      av.className = "avatar none"; av.onclick = null; av.title = "Không tải được ảnh";
    });
    av.onclick = () => openViewer(r);
  } else {
    av = document.createElement("div"); av.className = "avatar none";
    av.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>';
  }

  const info = document.createElement("div"); info.className = "info";
  const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = r.name || "(Chưa có tên)";
  const meta = document.createElement("div"); meta.className = "meta";
  const parts = [r.mssv, r.cls, fmtTime(r.time)].filter(Boolean);
  meta.textContent = parts.join(" · ");
  info.append(nm, meta);

  const b = document.createElement("span"); b.className = "badge " + r.result; b.textContent = LABEL[r.result];
  li.append(av, info, b);
  return li;
}

function render() {
  const q = plain($("q").value.trim());
  const match = r => !q || plain(r.name + " " + r.mssv + " " + r.cls).includes(q);

  // Số liệu (không phụ thuộc ô tìm kiếm)
  const cnt = { present:0, late:0, absent:0 };
  records.forEach(r => cnt[r.result]++);
  const all = records.length;
  $("s-all").textContent = $("t-all").textContent = all;
  GROUPS.forEach(g => { $("s-" + g.key).textContent = $("t-" + g.key).textContent = cnt[g.key]; });

  const box = $("content"); box.textContent = "";
  const shown = records.filter(r => match(r) && (filter === "all" || r.result === filter));

  if (!shown.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.textContent = !all ? "Chưa có sinh viên nào điểm danh." : "Không có sinh viên phù hợp.";
    box.appendChild(e); return;
  }

  GROUPS.forEach(g => {
    const items = shown.filter(r => r.result === g.key)
      .sort((a, b) => (a.name || "").localeCompare(b.name || "", "vi"));
    if (!items.length) return;

    const sec = document.createElement("section"); sec.className = "group";
    const h = document.createElement("h2"); h.className = "group-head";
    h.innerHTML = '<span class="dot ' + g.key + '"></span>';
    h.append(g.label + " ");
    const c = document.createElement("span"); c.className = "count"; c.textContent = "(" + items.length + ")";
    h.appendChild(c);
    const ul = document.createElement("ul"); ul.className = "list";
    items.forEach(r => ul.appendChild(makeItem(r)));
    sec.append(h, ul); box.appendChild(sec);
  });
}

/* ---------- Xem ảnh ---------- */
function openViewer(r) {
  setPhoto($("viewImg"), r.photo, 600);
  $("viewCap").innerHTML = "";
  $("viewCap").append(r.name);
  const s = document.createElement("small"); s.textContent = [r.mssv, r.cls].filter(Boolean).join(" · ");
  $("viewCap").appendChild(s);
  $("viewer").showModal();
}
$("viewClose").onclick = () => $("viewer").close();
$("viewer").addEventListener("click", e => { if (e.target === $("viewer")) $("viewer").close(); });

/* ---------- Tải dữ liệu ---------- */
function sampleData() {
  const t = h => new Date(DEADLINE.getTime() + h * 3600000).toISOString();
  return {
    records: [
      { mssv:"20211234", name:"Nguyễn Văn An",  cls:"CNTT01", time:t(-1.5) },
      { mssv:"20211235", name:"Trần Thị Bình",  cls:"CNTT01", time:t(-0.5) },
      { mssv:"20211240", name:"Lê Hoàng Cường", cls:"CNTT02", time:t(0.4) },
      { mssv:"20211251", name:"Phạm Minh Đức",  cls:"CNTT02", time:t(-2) }
    ],
    absent: [{ mssv:"20211260", name:"Võ Thị Hà", cls:"CNTT01" }]
  };
}

let loading = false;
async function load(silent) {
  if (loading) return;
  if (!session && !demo) { $("content").textContent = ""; return; }
  if (!pw && !demo) return;
  loading = true; $("btnReload").classList.add("spin"); $("errBox").hidden = true;
  try {
    let data;
    if (demo) data = sampleData();
    else {
      const url = SCRIPT_URL + "?action=list&s=" + encodeURIComponent(session) + "&pw=" + encodeURIComponent(pw);
      const res = await fetch(url);
      const raw = await res.text();
      if (params.has("debug")) {
        $("errBox").textContent = "DEBUG · HTTP " + res.status + " · " + url.replace(/pw=[^&]*/, "pw=***") + "\n\n" + raw.slice(0, 1500);
        $("errBox").style.whiteSpace = "pre-wrap"; $("errBox").style.wordBreak = "break-all"; $("errBox").hidden = false;
      }
      try { data = JSON.parse(raw); }
      catch (e) { throw new Error("Máy chủ trả về dữ liệu không hợp lệ. Kiểm tra Apps Script đã có hàm doGet và được triển khai phiên bản mới."); }
      if (data && data.code === "auth") { loading = false; $("btnReload").classList.remove("spin"); showLogin(data.message || "Phiên đăng nhập không hợp lệ, vui lòng đăng nhập lại."); return; }
      if (data && data.ok === false) throw new Error(data.message || "Không tải được danh sách.");
      if (!Array.isArray(data) && !Array.isArray(data.records) && !Array.isArray(data.list))
        throw new Error("Backend chưa hỗ trợ action=list (không thấy trường records). Cần thêm hàm doGet vào Apps Script và triển khai phiên bản mới.");
    }
    records = normalize(data);
    render();
    $("updated").textContent = "Cập nhật lúc " + new Date().toLocaleTimeString("vi-VN", { hour12:false });
  } catch (err) {
    console.error(err);
    $("errBox").textContent = (err.message || "Không kết nối được máy chủ.") + (params.has("debug") ? "\n\n" + $("errBox").textContent : "");
    $("errBox").hidden = false;
    if (!records.length) $("content").textContent = "";
  } finally {
    loading = false; $("btnReload").classList.remove("spin");
  }
}

/* ---------- Sự kiện ---------- */
$("q").addEventListener("input", render);
$("btnReload").onclick = () => load();
$("tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (!t) return;
  filter = t.dataset.f;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b === t ? "true" : "false"));
  render();
});

if (demo || pw) enter(); else showLogin("");
setInterval(() => { if (!document.hidden && !$("mainPanel").hidden) load(true); }, REFRESH_MS);
</script>
